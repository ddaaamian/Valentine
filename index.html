<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For You</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Inter', sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background: linear-gradient(135deg,#fdf2f8,#f8fafc);
    transition: background 1s ease;
}

.container{
    text-align:center;
    width:90%;
    max-width:420px;
    transition: all 0.5s ease;
}

h1{
    font-size:1.6rem;
    margin-bottom:20px;
    color:#222;
    opacity:0;
    transform:translateY(20px);
    animation:fadeUp 1s forwards;
}

@keyframes fadeUp{
    to{
        opacity:1;
        transform:translateY(0);
    }
}

input{
    width:100%;
    padding:12px;
    border-radius:30px;
    border:1px solid #ddd;
    text-align:center;
    margin-bottom:15px;
    transition:0.3s;
}

input:focus{
    outline:none;
    border-color:#ff6b9a;
    box-shadow:0 0 10px rgba(255,107,154,0.2);
}

button{
    padding:10px 28px;
    border-radius:30px;
    border:none;
    cursor:pointer;
    transition:0.3s ease;
    font-size:0.95rem;
}

.primary{
    background:#ff6b9a;
    color:white;
}

.secondary{
    background:white;
    color:#333;
    border:1px solid #ddd;
    position:absolute;
}

button:hover{
    transform:translateY(-2px);
    box-shadow:0 8px 20px rgba(0,0,0,0.08);
}

.hidden{
    opacity:0;
    transform:scale(0.95);
    pointer-events:none;
}

#error{
    font-size:0.85rem;
    color:#d6336c;
    margin-top:5px;
    min-height:18px;
}

.buttons{
    position:relative;
    margin-top:25px;
}

.success-text{
    font-size:1.4rem;
    color:#222;
    line-height:1.6;
}
</style>
</head>
<body>

<div class="container" id="nameStep">
    <h1>Masukin nama kamu dulu ya</h1>
    <input type="text" id="nameInput" placeholder="Tulis nama lengkap...">
    <button class="primary" onclick="validateName()">Lanjut</button>
    <div id="error"></div>
</div>

<div class="container hidden" id="questionStep">
    <h1 id="questionText"></h1>
    <div class="buttons">
        <button id="yes" class="primary">Yes</button>
        <button id="no" class="secondary">No</button>
    </div>
</div>

<div class="container hidden" id="successStep">
    <div class="success-text" id="finalText"></div>
    <br><br>
    <button onclick="location.reload()" class="primary">Restart</button>
</div>

<script>
const allowedNames = [
"nadira",
"nadira anindya zahra",
"nadira anindya",
"anindya zahra"
];

function normalize(text){
    return text.toLowerCase().trim();
}

function validateName(){
    const input = document.getElementById("nameInput").value;
    const error = document.getElementById("error");
    const normalized = normalize(input);

    if(allowedNames.includes(normalized)){
        document.getElementById("nameStep").classList.add("hidden");

        setTimeout(()=>{
            document.getElementById("questionStep").classList.remove("hidden");
            document.getElementById("questionText").innerText =
                "Hi " + input + ", aku cuma mau tanya satu hal kecil...";
        },400);

    } else {
        error.innerText = "Kayaknya itu bukan namanya deh.";
    }
}

const yesBtn = document.getElementById("yes");
const noBtn = document.getElementById("no");

noBtn.addEventListener("mouseenter", () => {
    const x = Math.random() * 200 - 100;
    const y = Math.random() * 100 - 50;
    noBtn.style.transform = `translate(${x}px, ${y}px)`;
});

yesBtn.addEventListener("click", () => {
    document.getElementById("questionStep").classList.add("hidden");

    setTimeout(()=>{
        document.getElementById("successStep").classList.remove("hidden");
        document.getElementById("finalText").innerHTML =
            "Makasih ya.<br><br>Berarti mulai sekarang, kita resmi satu tim.<br>Pelan-pelan aja, tapi bareng.";
        document.body.style.background =
            "linear-gradient(135deg,#ffe4ec,#f8f9fa)";
    },400);
});
</script>

</body>
</html>
