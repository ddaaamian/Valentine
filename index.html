<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hey</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Inter', sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background: linear-gradient(135deg,#f8f9fa,#e9ecef);
    transition: background 0.8s ease;
}

.container{
    text-align:center;
    width:90%;
    max-width:400px;
    transition: all 0.4s ease;
}

h1{
    font-size:1.6rem;
    margin-bottom:20px;
    color:#222;
}

input{
    width:100%;
    padding:12px;
    border-radius:25px;
    border:1px solid #ccc;
    text-align:center;
    font-size:0.95rem;
    margin-bottom:15px;
    transition:0.3s ease;
}

input:focus{
    outline:none;
    border-color:#111;
}

button{
    padding:10px 28px;
    border-radius:25px;
    border:none;
    background:#111;
    color:white;
    cursor:pointer;
    transition: all 0.25s ease;
}

button:hover{
    transform:translateY(-2px);
    box-shadow:0 8px 20px rgba(0,0,0,0.08);
}

.secondary{
    background:white;
    color:#111;
    border:1px solid #ddd;
    position:absolute;
}

.buttons{
    position:relative;
    margin-top:25px;
}

.hidden{
    opacity:0;
    transform:scale(0.95);
    pointer-events:none;
}

#error{
    font-size:0.85rem;
    color:#d6336c;
    margin-top:5px;
    min-height:18px;
}

.success-text{
    font-size:1.3rem;
    color:#111;
}
</style>
</head>
<body>

<!-- STEP 1: Input Nama -->
<div class="container" id="nameStep">
    <h1>Masukin nama kamu dulu</h1>
    <input type="text" id="nameInput" placeholder="Tulis nama lengkap...">
    <button onclick="validateName()">Lanjut</button>
    <div id="error"></div>
</div>

<!-- STEP 2: Pertanyaan -->
<div class="container hidden" id="questionStep">
    <h1 id="questionText"></h1>
    <div class="buttons">
        <button id="yes">Yes</button>
        <button id="no" class="secondary">No</button>
    </div>
</div>

<!-- STEP 3: Ending -->
<div class="container hidden" id="successStep">
    <div class="success-text" id="finalText"></div>
    <br><br>
    <button onclick="location.reload()">Restart</button>
</div>

<script>
const allowedNames = [
"nadira",
"nadira anindya zahra",
"nadira anindya",
"anindya zahra"
];

function normalize(text){
    return text.toLowerCase().trim();
}

function validateName(){
    const input = document.getElementById("nameInput").value;
    const error = document.getElementById("error");
    const normalized = normalize(input);

    if(allowedNames.includes(normalized)){
        document.getElementById("nameStep").classList.add("hidden");

        setTimeout(()=>{
            document.getElementById("questionStep").classList.remove("hidden");
            document.getElementById("questionText").innerText =
                "Hi " + input + ", would you be my Valentine?";
        },400);

    } else {
        error.innerText = "Nama tidak dikenali.";
    }
}

const yesBtn = document.getElementById("yes");
const noBtn = document.getElementById("no");

// Tombol No smooth kabur
noBtn.addEventListener("mouseenter", () => {
    const x = Math.random() * 180 - 90;
    const y = Math.random() * 80 - 40;
    noBtn.style.transform = `translate(${x}px, ${y}px)`;
});

// Klik Yes
yesBtn.addEventListener("click", () => {
    document.getElementById("questionStep").classList.add("hidden");

    setTimeout(()=>{
        document.getElementById("successStep").classList.remove("hidden");
        document.getElementById("finalText").innerText = "Good choice.";
        document.body.style.background =
            "linear-gradient(135deg,#ffe8f0,#f1f3f5)";
    },400);
});
</script>

</body>
</html>
