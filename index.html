<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Valentine 💖</title>

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins', sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background: linear-gradient(135deg, #ff9a9e, #fad0c4);
    overflow:hidden;
    text-align:center;
    color:white;
}

.container{
    position:relative;
}

h1{
    font-size:2.2rem;
    margin-bottom:20px;
}

.buttons{
    margin-top:20px;
}

button{
    padding:12px 25px;
    font-size:1rem;
    border:none;
    border-radius:25px;
    cursor:pointer;
    margin:10px;
    transition:0.3s;
}

#yes{
    background:#ff4d6d;
    color:white;
}

#no{
    background:white;
    color:#ff4d6d;
    position:absolute;
}

.hidden{
    display:none;
}

.success{
    animation:fadeIn 1s ease forwards;
}

@keyframes fadeIn{
    from{opacity:0; transform:scale(0.8);}
    to{opacity:1; transform:scale(1);}
}

/* Floating hearts */
.heart{
    position:absolute;
    color:white;
    animation:float 6s linear infinite;
}

@keyframes float{
    0%{transform:translateY(100vh); opacity:0;}
    50%{opacity:1;}
    100%{transform:translateY(-10vh); opacity:0;}
}
</style>
</head>
<body>

<div class="container" id="main">
    <h1 id="question">Mau gak jadi Valentine aku? 💖</h1>
    <div class="buttons">
        <button id="yes">Yes 💕</button>
        <button id="no">No 😢</button>
    </div>
</div>

<div class="container hidden" id="success">
    <h1>YAYYY 💘</h1>
    <h2 id="resultText"></h2>
    <br>
    <button onclick="showMessage()">Klik sini 😳</button>
    <p id="randomMessage" style="margin-top:15px;"></p>
    <br>
    <button onclick="location.reload()">Restart 🔄</button>
</div>

<script>
const noBtn = document.getElementById("no");
const yesBtn = document.getElementById("yes");
const main = document.getElementById("main");
const success = document.getElementById("success");
const resultText = document.getElementById("resultText");
const randomMessage = document.getElementById("randomMessage");

// Ambil nama dari URL (?name=Rani)
const params = new URLSearchParams(window.location.search);
const name = params.get("name") || "Kamu";

// Tombol NO kabur
noBtn.addEventListener("mouseover", function(){
    const x = Math.random() * (window.innerWidth - 100);
    const y = Math.random() * (window.innerHeight - 50);
    noBtn.style.left = x + "px";
    noBtn.style.top = y + "px";
});

// Klik YES
yesBtn.addEventListener("click", function(){
    main.classList.add("hidden");
    success.classList.remove("hidden");
    success.classList.add("success");

    resultText.innerHTML = name + " resmi jadi Valentine aku! 💞";

    createHearts();
});

// Pesan random
const messages = [
"Aku serius loh ini bukan prank 😌",
"Kamu gak bisa kabur sekarang 💕",
"Officially mine 💍",
"Hari ini, besok, dan seterusnya 💖",
"Aku paling beruntung dapet kamu 🥺"
];

function showMessage(){
    const random = Math.floor(Math.random()*messages.length);
    randomMessage.innerHTML = messages[random];
}

// Floating hearts generator
function createHearts(){
    setInterval(()=>{
        const heart = document.createElement("div");
        heart.classList.add("heart");
        heart.innerHTML="💖";
        heart.style.left=Math.random()*100+"vw";
        heart.style.fontSize=(Math.random()*20+20)+"px";
        document.body.appendChild(heart);

        setTimeout(()=>{
            heart.remove();
        },6000);
    },300);
}
</script>

</body>
</html>
